[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlite-inference"
version = "0.1.0"
description = "DLite speculative decoding inference for Qwen3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "safetensors>=0.4",
  "torch==2.9.1",
  "transformers==5.20.1",
  "typing-extensions>=4.10",
]

[project.urls]
Repository = "https://github.com/SJTU-DAI-Sys/DLite"
Issues = "https://github.com/SJTU-DAI-Sys/DLite/issues"

[project.optional-dependencies]
agentic = ["requests>=2.31,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "huggingface-hub>=0.30"]
flash-attn = ["flash-attn"]
dev = ["pytest>=8", "ruff>=0.8"]
benchmark = ["datasets>=3", "huggingface-hub>=0.30"]
qwen35 = [
  "causal-conv1d==1.7.0",
  "flash-linear-attention[conv1d]==0.5.2",
]

[tool.uv]
preview = true

[tool.uv.extra-build-dependencies]
causal-conv1d = [{ requirement = "torch", match-runtime = true }]

[project.scripts]
dlite = "dlite.cli:main"
dlite-benchmark = "dlite.benchmark:main"
dlite-agentic = "dlite.agentic.cli:main"

[tool.setuptools.packages.find]
include = ["dlite*"]

[tool.setuptools.package-data]
"dlite.agentic" = ["README.md", "*.example.json"]
